<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Kavrynt system architecture</title>
  <desc id="description">Platform engineers use kavryctl or MCPServer resources to configure the Kavrynt control plane. The Operator reconciles resources into Registry. Registry synchronizes routes to Gateway, which sends MCP client requests to MCP server workloads.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/>
      <stop offset="1" stop-color="#202431"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a1f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55c2ff"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .eyebrow { fill: #ffad5a; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .title { fill: #fff; font-size: 25px; font-weight: 700; }
      .label { fill: #fff; font-size: 18px; font-weight: 700; }
      .copy { fill: #b9c0cd; font-size: 14px; font-weight: 400; }
      .flow { fill: #d8dde7; font-size: 13px; font-weight: 600; }
      .boundary { fill: none; stroke: #4b5262; stroke-width: 2; stroke-dasharray: 8 7; }
      .card { fill: #292e3c; stroke: #4a5264; stroke-width: 1.5; }
      .control { fill: none; stroke: #ff8a1f; stroke-width: 3; marker-end: url(#arrowOrange); }
      .data { fill: none; stroke: #55c2ff; stroke-width: 3; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="718" rx="17" fill="none" stroke="#3b414f"/>
  <text x="48" y="54" class="eyebrow">KAVRYNT MCP CONTROL PLANE</text>
  <text x="48" y="90" class="title">Desired state in. Governed MCP traffic out.</text>

  <rect x="315" y="128" width="835" height="540" rx="18" fill="none" stroke="#4b5262" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="338" y="112" width="192" height="32" rx="16" fill="#202431" stroke="#4b5262"/>
  <text x="365" y="133" class="copy">Kubernetes cluster</text>

  <text x="48" y="158" class="eyebrow">OPERATORS</text>
  <g filter="url(#shadow)">
    <rect x="48" y="178" width="220" height="92" rx="12" class="card"/>
    <circle cx="82" cy="215" r="15" fill="url(#accent)"/>
    <path d="M75 238c2-12 12-17 20-17s18 5 20 17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="116" y="210" class="label">Platform team</text>
    <text x="116" y="236" class="copy">declares MCP services</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="318" width="220" height="88" rx="12" class="card"/>
    <rect x="70" y="340" width="42" height="42" rx="8" fill="#3a4050" stroke="#ff8a1f"/>
    <text x="79" y="367" class="flow">&gt;_</text>
    <text x="128" y="354" class="label">kavryctl</text>
    <text x="128" y="379" class="copy">install and register</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="178" width="220" height="88" rx="12" class="card"/>
    <rect x="386" y="199" width="46" height="46" rx="8" fill="#3a4050" stroke="#ff8a1f"/>
    <path d="M397 211h24v20h-24zm5-6v6m14-6v6" fill="none" stroke="#ffad5a" stroke-width="2"/>
    <text x="449" y="214" class="label">MCPServer CR</text>
    <text x="449" y="239" class="copy">Kubernetes desired state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="178" width="220" height="88" rx="12" class="card"/>
    <circle cx="730" cy="222" r="23" fill="#3a4050" stroke="#ff8a1f"/>
    <path d="M730 207v30m-15-15h30" stroke="#ffad5a" stroke-width="3"/>
    <text x="768" y="214" class="label">Operator</text>
    <text x="768" y="239" class="copy">reconciles resources</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="330" width="220" height="96" rx="12" fill="#302d3a" stroke="#ff8a1f" stroke-width="2"/>
    <ellipse cx="730" cy="357" rx="23" ry="9" fill="#e95420"/>
    <path d="M707 357v32c0 5 10 9 23 9s23-4 23-9v-32" fill="#3a4050" stroke="#ff8a1f" stroke-width="2"/>
    <text x="768" y="369" class="label">Registry</text>
    <text x="768" y="394" class="copy">server inventory and routes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="500" width="220" height="96" rx="12" fill="#263441" stroke="#55c2ff" stroke-width="2"/>
    <path d="M707 548h46m-14-14 14 14-14 14" fill="none" stroke="#55c2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="768" y="539" class="label">Gateway</text>
    <text x="768" y="564" class="copy">runtime MCP routing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="500" width="155" height="96" rx="12" class="card"/>
    <circle cx="991" cy="548" r="18" fill="#344456" stroke="#55c2ff"/>
    <path d="M985 548h12m-6-6v12" stroke="#86d5ff" stroke-width="2"/>
    <text x="1020" y="540" class="label">MCP</text>
    <text x="1020" y="563" class="copy">servers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="500" width="220" height="96" rx="12" class="card"/>
    <circle cx="405" cy="548" r="22" fill="#344456" stroke="#55c2ff"/>
    <circle cx="405" cy="541" r="7" fill="#86d5ff"/>
    <path d="M391 562c2-9 9-13 14-13s12 4 14 13" fill="#86d5ff"/>
    <text x="443" y="539" class="label">MCP clients</text>
    <text x="443" y="564" class="copy">AI agents and applications</text>
  </g>

  <rect x="268" y="222" width="87" height="4" rx="2" fill="#ff8a1f"/>
  <path d="M365 224l-12-7v14z" fill="#ff8a1f"/>
  <text x="283" y="210" class="flow">kubectl apply</text>
  <rect x="268" y="360" width="412" height="4" rx="2" fill="#ff8a1f"/>
  <path d="M690 362l-12-7v14z" fill="#ff8a1f"/>
  <text x="390" y="348" class="flow">Registry API</text>
  <rect x="585" y="220" width="95" height="4" rx="2" fill="#ff8a1f"/>
  <path d="M690 222l-12-7v14z" fill="#ff8a1f"/>
  <text x="604" y="208" class="flow">watch</text>
  <rect x="798" y="266" width="4" height="54" rx="2" fill="#ff8a1f"/>
  <path d="M800 330l-7-12h14z" fill="#ff8a1f"/>
  <text x="813" y="303" class="flow">reconcile</text>
  <rect x="798" y="426" width="4" height="64" rx="2" fill="#ff8a1f"/>
  <path d="M800 500l-7-12h14z" fill="#ff8a1f"/>
  <text x="813" y="467" class="flow">route sync</text>

  <rect x="585" y="546" width="95" height="4" rx="2" fill="#55c2ff"/>
  <path d="M690 548l-12-7v14z" fill="#55c2ff"/>
  <text x="605" y="533" class="flow">MCP request</text>
  <rect x="910" y="546" width="40" height="4" rx="2" fill="#55c2ff"/>
  <path d="M960 548l-12-7v14z" fill="#55c2ff"/>
  <text x="916" y="533" class="flow">proxy</text>

  <rect x="350" y="626" width="540" height="24" rx="12" fill="#242a36"/>
  <circle cx="371" cy="638" r="5" fill="#ff8a1f"/>
  <text x="386" y="643" class="copy">Control plane</text>
  <circle cx="512" cy="638" r="5" fill="#55c2ff"/>
  <text x="527" y="643" class="copy">Data plane</text>
  <text x="650" y="643" class="copy">Customer workloads remain in their cluster</text>
</svg>
