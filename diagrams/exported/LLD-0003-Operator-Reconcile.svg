<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Operator Reconcile Flow</title>
  <desc id="desc">Low-level sequence showing MCPServer apply, controller reconcile, Registry upsert/delete, status update, and finalizer cleanup.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111827}.subtitle{font:400 14px Arial,sans-serif;fill:#4b5563}
      .box-title{font:700 16px Arial,sans-serif}.box-sub{font:400 12px Arial,sans-serif}.label{font:700 12px Arial,sans-serif}.step{font:700 13px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="40" y="58" class="title">Kubernetes Operator Reconcile Flow</text>
  <text x="40" y="88" class="subtitle">LLD-0003: MCPServer CR lifecycle, Registry sync, status, and finalizer cleanup</text>
  <rect x="60" y="150" width="170" height="62" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="93" y="187" class="box-title" fill="#164e63">Developer / CI</text>
  <rect x="310" y="150" width="230" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="346" y="181" class="box-title" fill="#1e3a8a">Kubernetes API Server</text><text x="334" y="203" class="box-sub" fill="#1e3a8a">MCPServer + status subresource</text>
  <rect x="620" y="150" width="230" height="72" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="658" y="181" class="box-title" fill="#581c87">MCPServerReconciler</text><text x="657" y="203" class="box-sub" fill="#581c87">controller-runtime manager</text>
  <rect x="930" y="150" width="210" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="974" y="181" class="box-title" fill="#075985">Kavrynt Registry</text><text x="970" y="203" class="box-sub" fill="#075985">POST/DELETE /v1/servers</text>
  <line x1="230" y1="181" x2="310" y2="181" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="238" y="162" class="label" fill="#164e63">1. kubectl apply MCPServer</text>
  <line x1="540" y1="186" x2="620" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="555" y="166" class="label" fill="#1d4ed8">2. watch event</text>
  <polygon points="730,285 820,335 730,385 640,335" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="674" y="340" class="box-title" fill="#0f172a">Resource deleting?</text>
  <rect x="390" y="455" width="260" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="485" class="box-title" fill="#14532d">Create / Update path</text><text x="413" y="508" class="box-sub" fill="#14532d">ensure finalizer, map CR to Registry manifest</text>
  <rect x="790" y="455" width="260" height="78" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="877" y="485" class="box-title" fill="#7f1d1d">Delete path</text><text x="819" y="508" class="box-sub" fill="#7f1d1d">delete Registry record, remove finalizer</text>
  <line x1="680" y1="372" x2="555" y2="455" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="588" y="420" class="label" fill="#14532d">no</text>
  <line x1="785" y1="372" x2="875" y2="455" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/><text x="825" y="420" class="label" fill="#7f1d1d">yes</text>
  <line x1="650" y1="494" x2="930" y2="186" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="735" y="330" class="label" fill="#075985">POST /v1/servers</text>
  <line x1="920" y1="455" x2="1035" y2="222" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/><text x="938" y="355" class="label" fill="#7f1d1d">DELETE /v1/servers/{name}</text>
  <rect x="390" y="620" width="260" height="74" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="461" y="649" class="box-title" fill="#14532d">Status update</text><text x="421" y="672" class="box-sub" fill="#14532d">Registered=True, registrySyncedAt</text>
  <rect x="790" y="620" width="260" height="74" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="866" y="649" class="box-title" fill="#92400e">Failure status</text><text x="823" y="672" class="box-sub" fill="#92400e">Registered=False, registryError, requeue</text>
  <line x1="930" y1="222" x2="620" y2="620" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><text x="730" y="566" class="label" fill="#14532d">on success</text>
  <line x1="1035" y1="222" x2="920" y2="620" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-amber)"/><text x="970" y="570" class="label" fill="#92400e">on error</text>
  <line x1="390" y1="657" x2="425" y2="222" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/><text x="360" y="435" class="label" fill="#14532d">update status</text>
  <line x1="790" y1="657" x2="540" y2="222" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-amber)"/><text x="610" y="625" class="label" fill="#92400e">update status</text>
</svg>
