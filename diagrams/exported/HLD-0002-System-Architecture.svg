<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
  <title id="title">Kavrynt MVP System Architecture</title>
  <desc id="desc">Kind-tested architecture showing kavryctl, Kubernetes Operator, Registry, Gateway, MCPServer custom resource, and MCP server workload.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111827}.subtitle{font:400 14px Arial,sans-serif;fill:#4b5563}
      .zone-title{font:700 15px Arial,sans-serif;fill:#0f172a}.ns-title{font:700 14px Arial,sans-serif}
      .box-title{font:700 16px Arial,sans-serif}.box-sub{font:400 12px Arial,sans-serif}.label{font:700 12px Arial,sans-serif}.note{font:400 14px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1320" height="900" fill="#ffffff"/>
  <text x="40" y="58" class="title">Kavrynt MVP System Architecture</text>
  <text x="40" y="88" class="subtitle">Kind-tested flow: MCPServer CR -> Operator -> Registry -> Gateway -> MCP workload</text>
  <rect x="40" y="130" width="250" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="160" class="zone-title">Developer laptop</text>
  <rect x="330" y="120" width="850" height="560" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="350" y="150" class="zone-title">Kind / Kubernetes cluster</text>
  <rect x="370" y="170" width="500" height="430" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="390" y="198" class="ns-title" fill="#1e3a8a">Namespace: kavrynt-system</text>
  <rect x="900" y="170" width="240" height="430" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text x="920" y="198" class="ns-title" fill="#064e3b">Namespace: application/default</text>
  <rect x="75" y="195" width="180" height="72" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="100" y="226" class="box-title" fill="#164e63">kavryctl</text><text x="100" y="247" class="box-sub" fill="#164e63">CLI install, validate, register</text>
  <rect x="75" y="295" width="180" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="100" y="326" class="box-title" fill="#4c1d95">AI client / MCP host</text><text x="100" y="347" class="box-sub" fill="#4c1d95">Calls Gateway endpoint</text>
  <rect x="410" y="245" width="190" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="434" y="277" class="box-title" fill="#1e3a8a">Kubernetes Operator</text><text x="434" y="299" class="box-sub" fill="#1e3a8a">Watches MCPServer CRs</text>
  <rect x="640" y="245" width="190" height="76" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="680" y="277" class="box-title" fill="#075985">Registry</text><text x="660" y="299" class="box-sub" fill="#075985">Source of truth: /v1/servers</text>
  <rect x="640" y="405" width="190" height="76" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="682" y="437" class="box-title" fill="#581c87">Gateway</text><text x="663" y="459" class="box-sub" fill="#581c87">Route table + HTTP proxy</text>
  <rect x="925" y="245" width="190" height="76" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="963" y="277" class="box-title" fill="#065f46">MCPServer CR</text><text x="961" y="299" class="box-sub" fill="#065f46">kavrynt.io/v1alpha1</text>
  <rect x="925" y="405" width="190" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="952" y="437" class="box-title" fill="#14532d">MCP server workload</text><text x="963" y="459" class="box-sub" fill="#14532d">HTTP upstream service</text>
  <rect x="430" y="510" width="190" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="456" y="536" class="box-title" fill="#92400e">kubectl port-forward</text><text x="463" y="556" class="box-sub" fill="#92400e">local developer access</text>
  <line x1="255" y1="231" x2="925" y2="283" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/><text x="525" y="235" class="label" fill="#065f46">apply CR</text>
  <line x1="925" y1="283" x2="600" y2="283" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="738" y="270" class="label" fill="#1d4ed8">watch</text>
  <line x1="600" y1="283" x2="640" y2="283" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="596" y="260" class="label" fill="#075985">POST /v1/servers</text>
  <line x1="735" y1="321" x2="735" y2="405" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="748" y="365" class="label" fill="#581c87">sync routes</text>
  <line x1="255" y1="331" x2="640" y2="443" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="370" y="366" class="label" fill="#4c1d95">/mcp/&lt;name&gt;</text>
  <line x1="830" y1="443" x2="925" y2="443" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="850" y="426" class="label" fill="#14532d">proxy HTTP</text>
  <line x1="165" y1="267" x2="430" y2="541" stroke="#f59e0b" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/><text x="240" y="450" class="label" fill="#92400e">test access</text>
  <rect x="40" y="720" width="1140" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="750" class="note">Validated locally on Kind: Registry, Gateway, Operator, and mock MCP workload rolled out successfully.</text>
  <text x="60" y="775" class="note">Operator set Registered=True; Gateway routed POST /mcp/demo-mcp/tools/list to the mock service.</text>
</svg>
