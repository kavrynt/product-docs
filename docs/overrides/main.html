{% extends "base.html" %}

{% block extrahead %}
  {#- Apply a collapsed sidebar before first paint (assets/javascripts/sidebar.js). -#}
  <script>
    try {
      if (localStorage.getItem("kv-sidebar") === "hidden") {
        document.documentElement.setAttribute("data-kv-sidebar", "hidden");
      }
    } catch (error) {}
  </script>
{% endblock %}
