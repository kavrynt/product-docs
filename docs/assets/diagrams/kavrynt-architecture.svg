<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880" font-family="Helvetica, Arial, sans-serif">
<title>Kavrynt system architecture</title>
<desc>Platform teams register MCPServer resources with the Kubernetes API server. The Operator validates them and discovers tools. The Gateway watches them, authenticates MCP clients, applies policy, writes audit events, and proxies traffic to MCP server workloads.</desc>
