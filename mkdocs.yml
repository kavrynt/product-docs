site_name: Kavrynt Docs
site_url: https://docs.kavrynt.com
site_description: Documentation for Kavrynt, a Kubernetes-native MCP control plane.

# The header shows this repository with its latest release, stars, and forks.
repo_url: https://github.com/kavrynt/kavrynt
repo_name: kavrynt/kavrynt
# Pages are edited in this docs repository, not the runtime repository.
edit_uri: https://github.com/kavrynt/product-docs/edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/kavrynt-mark.svg
  favicon: assets/images/Kavrynt_logo.svg
  language: en
  icon:
    edit: material/file-edit-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  # Follows the reader's system setting until they pick light or dark with the
  # header toggle; Material remembers the choice.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system theme
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

# search is listed because naming any plugin replaces MkDocs' default list.
plugins:
  - search
  - redirects:
      redirect_maps:
        # The CLI reference moved to its own tab.
        reference/kavryctl.md: cli/index.md

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/sidebar.js

extra:
  # "Ask AI" chat widget from Kapa.ai, answering from these docs. It is not
  # loaded until website_id is set: create a project at kapa.ai, add
  # https://docs.kavrynt.com as a source, allow the docs domain (and
  # 127.0.0.1 for local preview) in the Kapa dashboard, then paste the
  # project's website ID here.
  ask_ai:
    website_id: ""
    example_questions:
      - How do I register an MCP server?
      - How does the Gateway authenticate MCP clients?
      - How do I verify the audit log?

  # Header (desktop) and footer links. A link with an empty url is hidden.
  # The header shows these as icons; header: false keeps a link in the footer
  # only (GitHub already appears in the header as the repository widget).
  header_links:
    - name: Home
      url: https://kavrynt.com
      icon: material/home-outline
    - name: GitHub
      url: https://github.com/kavrynt/kavrynt
      icon: fontawesome/brands/github
      new_tab: true
      header: false
    - name: Discord
      url: "" # set the Discord invite URL to show this link
      icon: fontawesome/brands/discord
      new_tab: true

copyright: Copyright &copy; 2026 Kavrynt. All rights reserved.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Each top-level entry is a tab in the header.
nav:
  - Home: index.md
  - Get Started:
      - Overview: overview.md
      - Why Kavrynt: why-kavrynt.md
      - Quickstart: quickstart.md
      - "Test Kavrynt: a runbook": testing.md
  - Concepts:
      - System Architecture: architecture.md
      - MCP Concepts: concepts/mcp.md
  - Production:
      - Install on Kubernetes: installation.md
      - Security: security.md
      - Operations: operations.md
  - Components:
      - Gateway: components/gateway.md
      - Operator: components/operator.md
      - kavryctl: components/kavryctl.md
  - CLI Reference:
      - Overview: cli/index.md
      - Manage servers: cli/servers.md
      - kavryctl doctor: cli/doctor.md
      - kavryctl export and import: cli/export-import.md
      - kavryctl audit verify: cli/audit-verify.md
      - kavryctl upgrade and rollback: cli/upgrade-rollback.md
  - Reference:
      - MCPServer Resource: reference/mcpserver.md
      - Troubleshooting: troubleshooting.md
      - Release Notes: release-notes.md
  - Community:
      - Overview: community/index.md
      - Contributing: community/contributing.md
      - Governance and Maintainers: community/governance.md
      - Code of Conduct: community/code-of-conduct.md
      - Reporting Vulnerabilities: community/security-reporting.md
      - Roadmap: community/roadmap.md
