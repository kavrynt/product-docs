site_name: Kavrynt Docs
site_url: https://docs.kavrynt.com
site_description: Documentation for Kavrynt, a Kubernetes-native MCP control plane.

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/Kavrynt_logo.svg
  favicon: assets/images/Kavrynt_logo.svg
  language: en
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
  font:
    text: Inter
    code: Roboto Mono

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; 2026 Kavrynt. All rights reserved.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview: overview.md
  - Get Started:
      - Quickstart on Kind: quickstart.md
      - Install on Kubernetes: installation.md
  - Architecture:
      - System Architecture: architecture.md
      - MCP Concepts: concepts/mcp.md
  - Components:
      - Gateway: components/gateway.md
      - Operator: components/operator.md
      - kavryctl: components/kavryctl.md
  - Reference:
      - MCPServer Resource: reference/mcpserver.md
      - kavryctl CLI: reference/kavryctl.md
      - Troubleshooting: troubleshooting.md
      - Release Notes: release-notes.md
