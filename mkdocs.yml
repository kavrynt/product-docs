site_name: Kavrynt Docs
site_url: https://docs.kavrynt.com
site_description: Documentation for Kavrynt, a Kubernetes-native MCP control plane.

# The header shows this repository with its latest release, stars, and forks.
repo_url: https://github.com/kavrynt/kavrynt
repo_name: kavrynt/kavrynt
# Pages are edited in this docs repository, not the runtime repository.
edit_uri: https://github.com/kavrynt/product-docs/edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/kavrynt-mark.svg
  favicon: assets/images/Kavrynt_logo.svg
  language: en
  icon:
    edit: material/file-edit-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  # Follows the reader's system setting until they pick light or dark with the
  # header toggle; Material remembers the choice.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system theme
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/sidebar.js

extra:
  # Header (desktop) and footer links. A link with an empty url is hidden.
  # The header shows these as icons; header: false keeps a link in the footer
  # only (GitHub already appears in the header as the repository widget).
  header_links:
    - name: Home
      url: https://kavrynt.com
      icon: material/home-outline
    - name: GitHub
      url: https://github.com/kavrynt/kavrynt
      icon: fontawesome/brands/github
      new_tab: true
      header: false
    - name: Discord
      url: "" # set the Discord invite URL to show this link
      icon: fontawesome/brands/discord
      new_tab: true

copyright: Copyright &copy; 2026 Kavrynt. All rights reserved.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Each top-level entry is a tab in the header.
nav:
  - Home: index.md
  - Get Started:
      - Overview: overview.md
      - Why Kavrynt: why-kavrynt.md
      - Quickstart: quickstart.md
      - "Test Kavrynt: a runbook": testing.md
  - Concepts:
      - System Architecture: architecture.md
      - MCP Concepts: concepts/mcp.md
  - Production:
      - Install on Kubernetes: installation.md
      - Security: security.md
      - Operations: operations.md
  - Components:
      - Gateway: components/gateway.md
      - Operator: components/operator.md
      - kavryctl: components/kavryctl.md
  - Reference:
      - MCPServer Resource: reference/mcpserver.md
      - kavryctl CLI: reference/kavryctl.md
      - Troubleshooting: troubleshooting.md
      - Release Notes: release-notes.md
