site_name: Kavrynt Docs
site_url: https://docs.kavrynt.com
site_description: Documentation for Kavrynt, a Kubernetes-native MCP control plane.

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/Kavrynt_logo.svg
  favicon: assets/images/Kavrynt_logo.svg
  language: en
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  # Follows the reader's system setting until they pick light or dark with the
  # header toggle; Material remembers the choice.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system theme
  font:
    text: Inter
    code: Roboto Mono

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/sidebar.js

extra:
  # Header (desktop) and footer links. A link with an empty url is hidden.
  header_links:
    - name: Home
      url: https://kavrynt.com
      icon: material/home-outline
    - name: GitHub
      url: https://github.com/kavrynt/kavrynt
      icon: fontawesome/brands/github
      new_tab: true
    - name: Discord
      url: "" # set the Discord invite URL to show this link
      icon: fontawesome/brands/discord
      new_tab: true

copyright: Copyright &copy; 2026 Kavrynt. All rights reserved.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview: overview.md
  - Get Started:
      - Quickstart on Kind: quickstart.md
      - Install on Kubernetes: installation.md
  - Architecture:
      - System Architecture: architecture.md
      - MCP Concepts: concepts/mcp.md
  - Components:
      - Gateway: components/gateway.md
      - Operator: components/operator.md
      - kavryctl: components/kavryctl.md
  - Reference:
      - MCPServer Resource: reference/mcpserver.md
      - kavryctl CLI: reference/kavryctl.md
      - Troubleshooting: troubleshooting.md
      - Release Notes: release-notes.md
